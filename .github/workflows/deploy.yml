name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Check and deploy
    # GitHub-hosted on purpose: this repository is public, so it must not run on the self-hosted runners.
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: The pages match scripts/build.py
        run: |
          cp -R site "$RUNNER_TEMP/committed"
          python3 scripts/build.py
          diff -r "$RUNNER_TEMP/committed" site || { echo "::error::site/ is out of date: run python3 scripts/build.py and commit the result"; exit 1; }

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6a1cde1074a1925835edfca0f807efb5
        run: npx --yes wrangler@4 pages deploy site --project-name sherin-dev --branch main --commit-dirty=true
